<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15110e" />
    <script>
      /* Set the theme before first paint so the page never flashes the wrong lights */
      try {
        if (localStorage.getItem('adits-cinema-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#b3231a');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Film reviews by Adit, hung beside live listings: what's showing, coming soon, trailers, cast and where to watch." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Adit's Cinema</title>
  </head>
  <body>
    <noscript>Adit's Cinema needs JavaScript to show its listings.</noscript>
    <div id="root"></div>
  </body>
</html>
